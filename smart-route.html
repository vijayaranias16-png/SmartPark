<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Route - SmartPark</title>

    <link rel="stylesheet" href="https://vijayaranias16-png.github.io/SmartPark/style.css">
</head>

<body>

    <div class="route-container">

        <div class="route-header">
            <p>🎢 SMARTPARK</p>
            <h1>Your Smart Route 🗺️</h1>
            <span>We planned your park day for you!</span>
        </div>


        <div class="route-summary">

            <div>
                <strong>⏱️ 4 Hours</strong>
                <small>Total Time</small>
            </div>

            <div>
                <strong>🚶 650 m</strong>
                <small>Walking</small>
            </div>

            <div>
                <strong>🎢 4</strong>
                <small>Stops</small>
            </div>

        </div>


        <div class="route-list">

        </div>


        <button class="map-btn">
            🗺️ View Map
        </button>


        <button class="back-btn" onclick="window.location.href='plan.html'">
            ← Back to Plan
        </button>

    </div>


    <script>

        // Get selected information
        const selectedRides =
            JSON.parse(localStorage.getItem("selectedRides")) || [];

        const selectedTime =
            localStorage.getItem("selectedTime") || "4 Hours";


        // Walking distance for each ride category
        const walkingDistances = {

            "Thrill": 180,

            "Water": 220,

            "Family": 150,

            "Kids": 120

        };


        // Calculate total walking distance
        let totalWalking = 0;

        selectedRides.forEach(function(category) {

            totalWalking += walkingDistances[category] || 0;

        });


        // Show selected time
        document.querySelector(".route-summary strong").textContent =
            "⏱️ " + selectedTime;


        // Show walking distance
        document.querySelectorAll(".route-summary strong")[1].textContent =
            "🚶 " + totalWalking + " m";


        // Ride details
        const rides = {

            "Thrill": {

                type: "🎢 THRILL RIDE",

                name: "Starfall Coaster",

                wait: "10 min wait",

                crowd: "🟢 Low Crowd"

            },


            "Water": {

                type: "🌊 WATER RIDE",

                name: "River Rapids",

                wait: "25 min wait",

                crowd: "🔴 High Crowd"

            },


            "Family": {

                type: "👨‍👩‍👧 FAMILY RIDE",

                name: "Cloud Carousel",

                wait: "8 min wait",

                crowd: "🟡 Medium Crowd"

            },


            "Kids": {

                type: "🧒 KIDS RIDE",

                name: "Jungle Flyers",

                wait: "12 min wait",

                crowd: "🟢 Low Crowd"

            }

        };


        // Route list
        const routeList =
            document.querySelector(".route-list");


        // Clear old route cards
        routeList.innerHTML = "";


        // Create route cards for selected rides
        selectedRides.forEach(function(category, index) {

            if (rides[category]) {

                const ride = rides[category];


                const card =
                    document.createElement("div");


                card.className =
                    "route-card";


                card.innerHTML = `

                    <div class="route-number">
                        ${index + 1}
                    </div>

                    <div class="route-info">

                        <span>
                            ${ride.type}
                        </span>

                        <h2>
                            ${ride.name}
                        </h2>

                        <span>
                            ${ride.crowd}
                        </span>

                        <p>
                            ⏱️ ${ride.wait}
                            &nbsp; • &nbsp;
                            🚶 Stop ${index + 1}
                        </p>

                    </div>

                `;


                routeList.appendChild(card);


                // Add line between rides
                if (index < selectedRides.length - 1) {

                    const line =
                        document.createElement("div");

                    line.className =
                        "route-line";

                    routeList.appendChild(line);

                }

            }

        });


        // Show number of selected stops
        const stopsText =
            document.querySelectorAll(
                ".route-summary strong"
            )[2];


        stopsText.textContent =
            "🎢 " + selectedRides.length;

    </script>

</body>
</html>
