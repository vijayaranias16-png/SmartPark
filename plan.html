<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan My Day - SmartPark</title>
    <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>

    <div class="plan-container">

        <h1>🎢 Plan My Day</h1>

        <p>Tell us what kind of park day you want!</p>

        <div class="plan-card">

            <h2>🎯 What do you want to enjoy?</h2>

            <label>
                <input type="checkbox" name="rideType" value="Thrill">
                🎢 Thrill Rides
            </label>

            <label>
                <input type="checkbox" name="rideType" value="Water">
                🌊 Water Rides
            </label>

            <label>
                <input type="checkbox" name="rideType" value="Family">
                👨‍👩‍👧 Family Rides
            </label>

            <label>
                <input type="checkbox" name="rideType" value="Kids">
                🧒 Kids Zone
            </label>


            <h2>📍 Places to Visit</h2>

            <label>
                <input type="checkbox" name="placeType" value="Food">
                🍔 Food
            </label>

            <label>
                <input type="checkbox" name="placeType" value="Restroom">
                🚻 Restroom
            </label>

            <label>
                <input type="checkbox" name="placeType" value="Locker">
                🔐 Locker
            </label>


            <h2>⏰ How much time do you have?</h2>

            <select id="timeSelect">
                <option value="2 Hours">2 Hours</option>
                <option value="4 Hours">4 Hours</option>
                <option value="6 Hours">6 Hours</option>
                <option value="Full Day">Full Day</option>
            </select>


            <h2>🚶 Walking Preference</h2>

            <select id="walkingSelect">
                <option value="Less Walking">Less Walking</option>
                <option value="Normal Walking">Normal Walking</option>
                <option value="I Don't Mind Walking">I Don't Mind Walking</option>
            </select>


            <button onclick="generateRoute()">
                🚀 Generate Smart Route
            </button>

        </div>

    </div>


<script>

function generateRoute() {

    /* ==============================
       GET SELECTED RIDES
    ============================== */

    const selectedRides = [];

    document.querySelectorAll(
        'input[name="rideType"]:checked'
    ).forEach(function(item) {

        selectedRides.push(item.value);

    });


    /* ==============================
       GET SELECTED PLACES
    ============================== */

    const selectedPlaces = [];

    document.querySelectorAll(
        'input[name="placeType"]:checked'
    ).forEach(function(item) {

        selectedPlaces.push(item.value);

    });


    /* ==============================
       GET TIME
    ============================== */

    const time =
        document.getElementById("timeSelect").value;


    /* ==============================
       GET WALKING
    ============================== */

    const walking =
        document.getElementById("walkingSelect").value;


    /* ==============================
       SAVE DATA
    ============================== */

    localStorage.setItem(
        "selectedRides",
        JSON.stringify(selectedRides)
    );

    localStorage.setItem(
        "selectedPlaces",
        JSON.stringify(selectedPlaces)
    );

    localStorage.setItem(
        "selectedTime",
        time
    );

    localStorage.setItem(
        "walkingPreference",
        walking
    );


    /* ==============================
       TEST ALERT
    ============================== */

    alert(
        "Selected Rides: " +
        (selectedRides.length > 0
            ? selectedRides.join(", ")
            : "None") +

        "\nSelected Places: " +
        (selectedPlaces.length > 0
            ? selectedPlaces.join(", ")
            : "None") +

        "\nTime: " +
        time +

        "\nWalking: " +
        walking
    );


    /* ==============================
       GO TO SMART ROUTE
    ============================== */

    window.location.href = "smart-route.html";

}

</script>

</body>
</html>
