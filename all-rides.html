<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Rides - SmartPark</title>

    <link rel="stylesheet"
        href="https://vijayaranias16-png.github.io/SmartPark/style.css?v=20">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .rides-page {
            min-height: 100vh;
            padding: 30px 20px;
        }

        .rides-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .rides-header h1 {
            margin-bottom: 8px;
        }

        .rides-header p {
            margin-top: 0;
        }

        /* FILTER */

        .filter-box {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px auto 30px;
        }

        .filter-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #eeeeee;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #222;
            color: white;
        }

        /* MAP */

        .map-section {
            max-width: 1200px;
            margin: 0 auto 35px;
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .map-section h2 {
            text-align: center;
            margin-top: 0;
        }

        #smartparkMap {
            width: 100%;
            height: 600px;
            border-radius: 15px;
            overflow: hidden;
        }

        /* MAP DETAILS */

        .map-details {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background: #f7f7f7;
        }

        .map-details.show {
            display: block;
        }

        .selected-place {
            text-align: center;
            margin-bottom: 20px;
        }

        .selected-place h3 {
            margin-bottom: 5px;
        }

        .nearby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .nearby-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .nearby-card h4 {
            margin: 0 0 8px;
        }

        .nearby-card p {
            margin: 5px 0;
            font-size: 14px;
        }

        .place-tag {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #eeeeee;
            font-size: 12px;
            font-weight: bold;
        }

        /* RIDES */

        .rides-grid {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .ride-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
            transition: 0.25s;
        }

        .ride-card:hover {
            transform: translateY(-5px);
        }

        .ride-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .ride-content {
            padding: 18px;
        }

        .ride-icon {
            font-size: 30px;
        }

        .ride-content h2 {
            margin: 8px 0;
        }

        .ride-type {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .ride-info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .ride-info span {
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .low {
            background: #d9f7df;
            color: #137333;
        }

        .medium {
            background: #fff1c7;
            color: #9a6700;
        }

        .high {
            background: #ffd8d8;
            color: #b00020;
        }

        .back-home {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            background: #222;
            color: white;
        }

        /* INFO WINDOW */

        .info-window {
            min-width: 180px;
        }

        .info-window h3 {
            margin: 0 0 7px;
        }

        .info-window p {
            margin: 5px 0;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .rides-page {
                padding: 20px 12px;
            }

            #smartparkMap {
                height: 450px;
            }

            .map-section {
                padding: 12px;
            }

            .rides-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

/* =====================================================
   GET UPDATED RIDE DATA FROM ADMIN
===================================================== */

function getUpdatedRide(ride) {

    const saved =
        localStorage.getItem("ride_" + ride.id);

    if (saved) {

        try {

            const data = JSON.parse(saved);

            return {
                ...ride,
                wait: data.wait ?? ride.wait,
                crowd: data.crowd ?? ride.crowd
            };

        } catch (error) {

            return ride;

        }

    }

    return ride;
}


/* =====================================================
   SHOW RIDES
===================================================== */

function showRides(category, button) {

    const grid =
        document.getElementById("ridesGrid");

    grid.innerHTML = "";

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    if (button) {
        button.classList.add("active");
    }

    let filteredRides = rides;

    if (category !== "All") {

        filteredRides =
            rides.filter(
                ride => ride.type === category
            );

    }

    filteredRides.forEach(ride => {

        const updated =
            getUpdatedRide(ride);

        const crowdClass =
            updated.crowd.toLowerCase();

        const card =
            document.createElement("div");

        card.className = "ride-card";

        card.innerHTML = `

            <img
                class="ride-image"
                src="${updated.image}"
                alt="${updated.name}"
            >

            <div class="ride-content">

                <div class="ride-icon">
                    ${updated.icon}
                </div>

                <h2>
                    ${updated.name}
                </h2>

                <div class="ride-type">
                    ${updated.type} Ride
                </div>

                <div class="ride-info">

                    <span>
                        ⏱️ ${updated.wait} min
                    </span>

                    <span class="${crowdClass}">
                        👥 ${updated.crowd}
                    </span>

                </div>

            </div>
        `;

        grid.appendChild(card);

    });

}

        name: "First Aid Center",
        type: "First Aid",
        icon: "🩹",
        lat: 9.92500,
        lng: 78.12300
    }

];


/* =====================================================
   GOOGLE MAP
===================================================== */

let map;

let markers = [];

let infoWindow;


/* =====================================================
   INITIALIZE MAP
===================================================== */

function initMap() {

    const center = {
        lat: 9.92520,
        lng: 78.11980
    };


    map = new google.maps.Map(
        document.getElementById("smartparkMap"),
        {
            center: center,

            zoom: 16,

            mapTypeControl: true,

            streetViewControl: true,

            fullscreenControl: true,

            zoomControl: true
        }
    );


    infoWindow =
        new google.maps.InfoWindow();


    locations.forEach(
        location => {

            createMarker(location);

        }
    );

}


/* =====================================================
   CREATE MARKER
===================================================== */

function createMarker(location) {

    const marker =
        new google.maps.Marker({

            position: {
                lat: location.lat,
                lng: location.lng
            },

            map: map,

            title: location.name,

            label: {
                text: location.icon,
                fontSize: "20px"
            }

        });


    marker.addListener(
        "click",
        function () {

            showMarkerInfo(
                marker,
                location
            );

            showNearby(
                location
            );

        }
    );


    markers.push(marker);

}


/* =====================================================
   MARKER INFO
===================================================== */

function showMarkerInfo(
    marker,
    location
) {

    const html = `

        <div class="info-window">

            <h3>
                ${location.icon}
                ${location.name}
            </h3>

            <p>
                <strong>Type:</strong>
                ${location.type}
            </p>

        </div>

    `;

    infoWindow.setContent(html);

    infoWindow.open(
        map,
        marker
    );

}


/* =====================================================
   SHOW NEARBY LOCATIONS
===================================================== */

function showNearby(selected) {

    const details =
        document.getElementById(
            "mapDetails"
        );

    const selectedName =
        document.getElementById(
            "selectedPlaceName"
        );

    const selectedType =
        document.getElementById(
            "selectedPlaceType"
        );

    const nearbyGrid =
        document.getElementById(
            "nearbyGrid"
        );


    selectedName.innerHTML =
        `${selected.icon} ${selected.name}`;


    selectedType.innerHTML =
        `${selected.type} • Nearby SmartPark locations`;


    nearbyGrid.innerHTML = "";


    const nearby =
        locations
            .filter(
                location =>
                    location.name !== selected.name
            )
            .map(
                location => {

                    const distance =
                        calculateDistance(
                            selected.lat,
                            selected.lng,
                            location.lat,
                            location.lng
                        );

                    return {
                        ...location,
                        distance
                    };

                }
            )
            .filter(
                location =>
                    location.distance <= 0.20
            )
            .sort(
                (a, b) =>
                    a.distance - b.distance
            )
            .slice(0, 6);


    if (nearby.length === 0) {

        nearbyGrid.innerHTML = `

            <div class="nearby-card">

                <h4>
                    No nearby locations found
                </h4>

                <p>
                    Try another marker.
                </p>

            </div>

        `;

    } else {

        nearby.forEach(
            location => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "nearby-card";

                card.innerHTML = `

                    <h4>
                        ${location.icon}
                        ${location.name}
                    </h4>

                    <span class="place-tag">
                        ${location.type}
                    </span>

                    <p>
                        📍 ${location.distance.toFixed(2)} km
                    </p>

                `;

                nearbyGrid.appendChild(
                    card
                );

            }
        );

    }


    details.classList.add("show");


    details.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}


/* =====================================================
   DISTANCE CALCULATION
===================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        (lat2 - lat1)
        * Math.PI / 180;

    const dLon =
        (lon2 - lon1)
        * Math.PI / 180;

    const a =
        Math.sin(dLat / 2)
        * Math.sin(dLat / 2)
        +
        Math.cos(
            lat1 * Math.PI / 180
        )
        *
        Math.cos(
            lat2 * Math.PI / 180
        )
        *
        Math.sin(dLon / 2)
        *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}
