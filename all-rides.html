<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartPark Interactive Map</title>

    <link rel="stylesheet"
          href="https://vijayaranias16-png.github.io/SmartPark/style.css?v=17">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #17134d;
        }

        /* =========================
           MAIN PAGE
        ========================= */

        .map-page {
            min-height: 100vh;
            padding: 35px 4%;
            background:
                linear-gradient(
                    135deg,
                    #17134d,
                    #542078,
                    #d62d75
                );
        }

        /* =========================
           HEADER
        ========================= */

        .map-header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .map-header p {
            color: #ffd21c;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .map-header h1 {
            margin: 0;
            font-size: 46px;
        }

        .map-header span {
            display: block;
            margin-top: 10px;
            color: #eee;
            font-size: 17px;
        }

        /* =========================
           CATEGORY FILTER
        ========================= */

        .category-bar {
            background: white;
            max-width: 1200px;
            margin: 0 auto 25px;
            padding: 15px;
            border-radius: 18px;

            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-btn {
            border: none;
            padding: 11px 17px;
            border-radius: 12px;
            background: #eee;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .category-btn:hover {
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: #542078;
            color: white;
        }

        /* =========================
           MAP CONTAINER
        ========================= */

        .map-wrapper {
            max-width: 1250px;
            margin: auto;
            background: white;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 15px 40px #0006;
        }

        .park-map {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 520px;
            overflow: hidden;
            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #b9df83,
                    #8ecb68
                );
        }

        /* =========================
           PATHS
        ========================= */

        .path {
            position: absolute;
            background: #f6df9b;
            border: 5px solid #e7c979;
            border-radius: 50px;
        }

        .path-one {
            width: 82%;
            height: 70px;
            left: 8%;
            top: 45%;
            transform: rotate(-5deg);
        }

        .path-two {
            width: 65%;
            height: 60px;
            left: 18%;
            top: 22%;
            transform: rotate(10deg);
        }

        .path-three {
            width: 70%;
            height: 55px;
            left: 15%;
            top: 70%;
            transform: rotate(-10deg);
        }

        .path-four {
            width: 50%;
            height: 55px;
            left: 45%;
            top: 35%;
            transform: rotate(70deg);
        }

        .path-five {
            width: 45%;
            height: 48px;
            left: 5%;
            top: 65%;
            transform: rotate(45deg);
        }

        /* =========================
           MAP DECORATION
        ========================= */

        .tree {
            position: absolute;
            font-size: 24px;
            opacity: 0.85;
            pointer-events: none;
        }

        .t1 { left: 4%; top: 15%; }
        .t2 { left: 15%; top: 10%; }
        .t3 { left: 30%; top: 8%; }
        .t4 { left: 50%; top: 10%; }
        .t5 { left: 70%; top: 8%; }
        .t6 { left: 90%; top: 15%; }
        .t7 { left: 8%; top: 82%; }
        .t8 { left: 25%; top: 87%; }
        .t9 { left: 55%; top: 88%; }
        .t10 { left: 82%; top: 85%; }

        /* =========================
           WATER ZONES
        ========================= */

        .water-zone {
            position: absolute;
            background: #65c9ef;
            border: 5px solid #38a9d7;
            border-radius: 50%;
            opacity: 0.9;
        }

        .water-one {
            width: 130px;
            height: 80px;
            left: 5%;
            top: 27%;
        }

        .water-two {
            width: 150px;
            height: 90px;
            right: 5%;
            top: 25%;
        }

        /* =========================
           MAP TITLE
        ========================= */

        .map-title {
            position: absolute;
            top: 18px;
            left: 25px;

            background: white;
            padding: 10px 18px;
            border-radius: 15px;

            font-weight: bold;
            color: #542078;

            box-shadow: 0 5px 15px #0003;
            z-index: 20;
        }

        /* =========================
           MARKERS
        ========================= */

        .map-marker {
            position: absolute;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border: 3px solid white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            cursor: pointer;

            box-shadow:
                0 5px 12px #0006;

            transform:
                translate(-50%, -50%);

            transition: 0.2s;

            z-index: 10;
        }

        .map-marker:hover {
            transform:
                translate(-50%, -50%)
                scale(1.18);

            z-index: 50;
        }

        .map-marker.selected {
            transform:
                translate(-50%, -50%)
                scale(1.3);

            border: 4px solid #ffd21c;
            z-index: 100;
        }

        .ride-marker {
            background: #d62d75;
        }

        .food-marker {
            background: #f28b22;
        }

        .toy-marker {
            background: #8b45c6;
        }

        .restroom-marker {
            background: #2878d8;
        }

        .hotel-marker {
            background: #159b8b;
        }

        .locker-marker {
            background: #d69c13;
        }

        .firstaid-marker {
            background: #e53935;
        }

        /* =========================
           MARKER NUMBER
        ========================= */

        .marker-number {
            position: absolute;

            right: -7px;
            top: -9px;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: white;

            color: #542078;

            font-size: 11px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           DETAILS PANEL
        ========================= */

        .details-panel {
            max-width: 1200px;
            margin: 25px auto 0;

            background: white;

            border-radius: 22px;

            padding: 25px;

            display: none;

            box-shadow: 0 12px 30px #0005;
        }

        .details-panel.show {
            display: block;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            border-bottom: 1px solid #eee;

            padding-bottom: 15px;
        }

        .details-title {
            color: #542078;
        }

        .details-title h2 {
            margin: 0 0 5px;
        }

        .details-title p {
            margin: 0;
            color: #777;
        }

        .close-details {
            border: none;
            background: #eee;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .detail-body {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        .detail-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
        }

        .detail-icon-box {
            height: 180px;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f0fa;

            font-size: 70px;
        }

        .detail-info {
            color: #333;
        }

        .detail-info h3 {
            margin-top: 0;
            color: #542078;
        }

        /* =========================
           NEARBY SECTION
        ========================= */

        .nearby-section {
            margin-top: 25px;
        }

        .nearby-section h3 {
            color: #542078;
            margin-bottom: 12px;
        }

        .nearby-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }

        .nearby-card {
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 15px;

            cursor: pointer;

            background: #fafafa;

            transition: 0.2s;
        }

        .nearby-card:hover {
            border-color: #542078;
            transform: translateY(-3px);
        }

        .nearby-card strong {
            color: #542078;
        }

        .nearby-distance {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           LEGEND
        ========================= */

        .legend {
            max-width: 1200px;
            margin: 20px auto 0;

            background: white;

            padding: 15px;

            border-radius: 18px;

            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 13px;
            font-weight: bold;
        }

        .legend-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-home {
            display: block;

            max-width: 1200px;

            margin: 25px auto 0;

            padding: 15px;

            background: white;

            color: #542078;

            text-align: center;

            text-decoration: none;

            border-radius: 15px;

            font-weight: bold;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .map-header h1 {
                font-size: 34px;
            }

            .park-map {
                min-height: 450px;
            }

            .map-marker {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .detail-body {
                grid-template-columns: 1fr;
            }

            .nearby-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="map-page">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="map-header">

        <p>🗺️ SMARTPARK</p>

        <h1>
            Interactive Park Map
        </h1>

        <span>
            Explore rides, food, shops and essential facilities
        </span>

    </div>



    <!-- =========================
         FILTER
    ========================= -->

    <div class="category-bar">

        <button
            class="category-btn active"
            onclick="filterCategory('All', this)">
            🌐 All
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Ride', this)">
            🎢 Rides
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Food', this)">
            🍔 Food
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Toy', this)">
            🧸 Toys
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Restroom', this)">
            🚻 Restrooms
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Hotel', this)">
            🏨 Hotels
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Locker', this)">
            🔐 Lockers
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('FirstAid', this)">
            🩹 First Aid
        </button>

    </div>



    <!-- =========================
         MAP
    ========================= -->

    <div class="map-wrapper">

        <div
            class="park-map"
            id="parkMap">

            <div class="map-title">
                🎢 SmartPark Theme Park
            </div>


            <div class="path path-one"></div>
            <div class="path path-two"></div>
            <div class="path path-three"></div>
            <div class="path path-four"></div>
            <div class="path path-five"></div>


            <div class="water-zone water-one"></div>
            <div class="water-zone water-two"></div>


            <div class="tree t1">🌳</div>
            <div class="tree t2">🌳</div>
            <div class="tree t3">🌳</div>
            <div class="tree t4">🌳</div>
            <div class="tree t5">🌳</div>
            <div class="tree t6">🌳</div>
            <div class="tree t7">🌳</div>
            <div class="tree t8">🌳</div>
            <div class="tree t9">🌳</div>
            <div class="tree t10">🌳</div>

        </div>

    </div>



    <!-- =========================
         DETAILS
    ========================= -->

    <div
        class="details-panel"
        id="detailsPanel">

        <div class="details-header">

            <div class="details-title">

                <h2 id="detailName">
                    Location
                </h2>

                <p id="detailCategory">
                    Category
                </p>

            </div>

            <button
                class="close-details"
                onclick="closeDetails()">
                ×
            </button>

        </div>


        <div class="detail-body">

            <div id="detailVisual"></div>

            <div class="detail-info">

                <h3>
                    📍 Location Details
                </h3>

                <p id="detailDescription"></p>

            </div>

        </div>


        <div class="nearby-section">

            <h3>
                📍 Nearby Locations
            </h3>

            <div
                class="nearby-grid"
                id="nearbyGrid">
            </div>

        </div>

    </div>



    <!-- =========================
         LEGEND
    ========================= -->

    <div class="legend">

        <div class="legend-item">
            <span
                class="legend-dot ride-marker">
            </span>
            🎢 Rides
        </div>

        <div class="legend-item">
            <span
                class="legend-dot food-marker">
            </span>
            🍔 Food
        </div>

        <div class="legend-item">
            <span
                class="legend-dot toy-marker">
            </span>
            🧸 Toys
        </div>

        <div class="legend-item">
            <span
                class="legend-dot restroom-marker">
            </span>
            🚻 Restroom
        </div>

        <div class="legend-item">
            <span
                class="legend-dot hotel-marker">
            </span>
            🏨 Hotel
        </div>

        <div class="legend-item">
            <span
                class="legend-dot locker-marker">
            </span>
            🔐 Locker
        </div>

        <div class="legend-item">
            <span
                class="legend-dot firstaid-marker">
            </span>
            🩹 First Aid
        </div>

    </div>



    <a
        href="index.html"
        class="back-home">

        ← Back to Home

    </a>


</div>



<script src="park-data.js"></script>


<script>

/* ==================================================
   LOCATION DATA
================================================== */

const locations = [];


/* ==================================================
   RIDE DATA
================================================== */

function loadRides() {

    if (
        !window.parkData ||
        !Array.isArray(window.parkData.rides)
    ) {

        console.error(
            "park-data.js rides not found"
        );

        return;

    }


    const ridePositions = [

        [13, 25],
        [23, 18],
        [34, 27],
        [45, 18],
        [57, 25],

        [70, 18],
        [82, 28],
        [91, 40],
        [75, 48],
        [62, 42],

        [50, 52],
        [38, 47],
        [25, 55],
        [15, 63],
        [31, 70],

        [45, 65],
        [58, 73],
        [70, 64],
        [82, 73],
        [90, 60]

    ];


    window.parkData.rides.forEach(
        function(ride, index) {

            const position =
                ridePositions[index] ||
                [50, 50];


            locations.push({

                id:
                    "ride-" +
                    ride.id,

                name:
                    ride.name,

                category:
                    "Ride",

                icon:
                    ride.icon || "🎢",

                x:
                    position[0],

                y:
                    position[1],

                image:
                    ride.image || "",

                description:
                    ride.type +
                    " Ride • " +
                    ride.wait +
                    " min wait • " +
                    ride.crowd +
                    " crowd"

            });

        }
    );

}


/* ==================================================
   FOOD SHOPS - 10
================================================== */

const foodShops = [

    "Madurai Mess",
    "Chennai Tiffin Corner",
    "Kongu Kitchen",
    "Chettinad Treats",
    "Kaveri Food Court",
    "Marina Snacks",
    "Amma's Kitchen",
    "Tamil Virundhu",
    "Jigarthanda Junction",
    "Filter Coffee House"

];


const foodPositions = [

    [9, 39],
    [20, 34],
    [31, 38],
    [43, 34],
    [55, 37],
    [67, 34],
    [78, 39],
    [88, 47],
    [38, 82],
    [72, 84]

];


foodShops.forEach(
    function(name, index) {

        locations.push({

            id:
                "food-" + (index + 1),

            name:
                name,

            category:
                "Food",

            icon:
                "🍔",

            x:
                foodPositions[index][0],

            y:
                foodPositions[index][1],

            description:
                "Food shop serving refreshments and park meals."

        });

    }
);


/* ==================================================
   TOY SHOPS - 5
================================================== */

const toyShops = [

    "Kutty World",
    "Chinna Toys",
    "Tamilan Toy Hub",
    "Little Star Toys",
    "Bommai Veedu"

];


const toyPositions = [

    [12, 52],
    [28, 78],
    [52, 30],
    [67, 58],
    [91, 77]

];


toyShops.forEach(
    function(name, index) {

        locations.push({

            id:
                "toy-" + (index + 1),

            name:
                name,

            category:
                "Toy",

            icon:
                "🧸",

            x:
                toyPositions[index][0],

            y:
                toyPositions[index][1],

            description:
                "Toy shop with gifts and fun park souvenirs."

        });

    }
);


/* ==================================================
   RESTROOMS - 5
================================================== */

const restrooms = [

    "North Gate Restroom",
    "South Gate Restroom",
    "Central Park Restroom",
    "Water Zone Restroom",
    "Kids Zone Restroom"

];


const restroomPositions = [

    [7, 20],
    [18, 87],
    [49, 57],
    [85, 33],
    [87, 87]

];


restrooms.forEach(
    function(name, index) {

        locations.push({

            id:
                "restroom-" +
                (index + 1),

            name:
                name,

            category:
                "Restroom",

            icon:
                "🚻",

            x:
                restroomPositions[index][0],

            y:
                restroomPositions[index][1],

            description:
                "Restroom facility for park visitors."

        });

    }
);


/* ==================================================
   HOTELS - 5
================================================== */

const hotels = [

    "Vaigai Residency",
    "Marina Stay",
    "Madurai Comfort Inn",
    "Kaveri Residency",
    "Jasmine Residency"

];


const hotelPositions = [

    [22, 12],
    [40, 12],
    [60, 12],
    [78, 12],
    [94, 55]

];


hotels.forEach(
    function(name, index) {

        locations.push({

            id:
                "hotel-" +
                (index + 1),

            name:
                name,

            category:
                "Hotel",

            icon:
                "🏨",

            x:
                hotelPositions[index][0],

            y:
                hotelPositions[index][1],

            description:
                "Comfortable stay facility for park visitors."

        });

    }
);


/* ==================================================
   LOCKERS - 2
================================================== */

const lockerPositions = [

    [36, 62],
    [76, 68]

];


lockerPositions.forEach(
    function(position, index) {

        locations.push({

            id:
                "locker-" +
                (index + 1),

            name:
                "Smart Locker " +
                (index + 1),

            category:
                "Locker",

            icon:
                "🔐",

            x:
                position[0],

            y:
                position[1],

            description:
                "Secure locker facility for visitor belongings."

        });

    }
);


/* ==================================================
   FIRST AID - 1
================================================== */

locations.push({

    id:
        "firstaid-1",

    name:
        "SmartPark First Aid",

    category:
        "FirstAid",

    icon:
        "🩹",

    x:
        54,

    y:
        55,

    description:
        "First aid facility for basic visitor assistance."

});


/* ==================================================
   CREATE MARKERS
================================================== */

function createMarkers() {

    const map =
        document.getElementById(
            "parkMap"
        );


    locations.forEach(
        function(location) {

            const marker =
                document.createElement(
                    "button"
                );


            marker.className =
                "map-marker " +
                getMarkerClass(
                    location.category
                );


            marker.style.left =
                location.x + "%";


            marker.style.top =
                location.y + "%";


            marker.innerHTML = `

                ${location.icon}

            `;


            marker.title =
                location.name;


            marker.onclick =
                function() {

                    selectLocation(
                        location.id
                    );

                };


            marker.dataset.id =
                location.id;


            map.appendChild(marker);

        }
    );

}


/* ==================================================
   MARKER COLOR
================================================== */

function getMarkerClass(category) {

    if (category === "Ride")
        return "ride-marker";

    if (category === "Food")
        return "food-marker";

    if (category === "Toy")
        return "toy-marker";

    if (category === "Restroom")
        return "restroom-marker";

    if (category === "Hotel")
        return "hotel-marker";

    if (category === "Locker")
        return "locker-marker";

    if (category === "FirstAid")
        return "firstaid-marker";

    return "";

}


/* ==================================================
   SELECT LOCATION
================================================== */

function selectLocation(id) {

    const location =
        locations.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!location)
        return;


    /* remove previous selected */

    document
        .querySelectorAll(
            ".map-marker"
        )
        .forEach(
            function(marker) {

                marker.classList.remove(
                    "selected"
                );

            }
        );


    /* select current */

    const selectedMarker =
        document.querySelector(
            `[data-id="${id}"]`
        );


    if (selectedMarker) {

        selectedMarker.classList.add(
            "selected"
        );

    }


    /* details */

    document.getElementById(
        "detailName"
    ).textContent =
        location.icon +
        " " +
        location.name;


    document.getElementById(
        "detailCategory"
    ).textContent =
        location.category;


    document.getElementById(
        "detailDescription"
    ).textContent =
        location.description;


    /* visual */

    const visual =
        document.getElementById(
            "detailVisual"
        );


    if (
        location.category === "Ride" &&
        location.image
    ) {

        visual.innerHTML = `

            <img
                class="detail-image"
                src="${location.image}"
                alt="${location.name}"
            >

        `;

    }

    else {

        visual.innerHTML = `

            <div class="detail-icon-box">

                ${location.icon}

            </div>

        `;

    }


    /* nearby */

    showNearby(location);


    /* panel */

    document.getElementById(
        "detailsPanel"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "detailsPanel"
    ).scrollIntoView({

        behavior: "smooth",

        block: "nearest"

    });

}


/* ==================================================
   NEARBY LOCATIONS
================================================== */

function showNearby(current) {

    const nearbyGrid =
        document.getElementById(
            "nearbyGrid"
        );


    const nearby =
        locations

            .filter(
                function(item) {

                    return item.id !==
                        current.id;

                }
            )

            .map(
                function(item) {

                    const dx =
                        item.x -
                        current.x;

                    const dy =
                        item.y -
                        current.y;

                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    return {

                        location:
                            item,

                        distance:
                            distance

                    };

                }
            )

            .sort(
                function(a, b) {

                    return a.distance -
                        b.distance;

                }
            )

            .slice(0, 3);


    nearbyGrid.innerHTML = "";


    nearby.forEach(
        function(item) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "nearby-card";


            const estimatedDistance =
                Math.round(
                    item.distance * 12
                );


            card.innerHTML = `

                <strong>

                    ${item.location.icon}
                    ${item.location.name}

                </strong>

                <div class="nearby-distance">

                    📍 Approximately
                    ${estimatedDistance} m away

                </div>

                <div class="nearby-distance">

                    ${item.location.category}

                </div>

            `;


            card.onclick =
                function() {

                    selectLocation(
                        item.location.id
                    );

                };


            nearbyGrid.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   FILTER
================================================== */

function filterCategory(
    category,
    button
) {

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(btn) {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    document
        .querySelectorAll(
            ".map-marker"
        )
        .forEach(
            function(marker) {

                const id =
                    marker.dataset.id;


                const location =
                    locations.find(
                        function(item) {

                            return item.id === id;

                        }
                    );


                if (
                    category === "All" ||
                    location.category === category
                ) {

                    marker.style.display =
                        "flex";

                }

                else {

                    marker.style.display =
                        "none";

                }

            }
        );

}


/* ==================================================
   CLOSE DETAILS
================================================== */

function closeDetails() {

    document.getElementById(
        "detailsPanel"
    ).classList.remove(
        "show"
    );


    document
        .querySelectorAll(
            ".map-marker"
        )
        .forEach(
            function(marker) {

                marker.classList.remove(
                    "selected"
                );

            }
        );

}

   START
================================================== */

loadRides();

createMarkers();
