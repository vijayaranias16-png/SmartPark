/* =====================================
   INITIALIZE GOOGLE MAP
===================================== */

function initMap() {

    map = new google.maps.Map(
        document.getElementById("map"),
        {
            center: {
                lat: 9.9252,
                lng: 78.1198
            },

            zoom: 16,

            mapTypeControl: true,

            streetViewControl: false,

            fullscreenControl: true
        }
    );


    smartParkLocations.forEach(function(location) {

        const marker = new google.maps.Marker({

            position: {
                lat: location.lat,
                lng: location.lng
            },

            map: map,

            title: location.name,

            label: {
                text: location.icon,
                fontSize: "20px"
            }

        });


        marker.addListener("click", function() {

            showNearby(location);

        });

    });

}


/* =====================================
   SHOW NEARBY LOCATIONS
===================================== */

function showNearby(selectedLocation) {

    const nearby =
        smartParkLocations
        .filter(function(place) {

            if (place.name === selectedLocation.name) {
                return false;
            }

            const distance =
                Math.sqrt(
                    Math.pow(place.lat - selectedLocation.lat, 2) +
                    Math.pow(place.lng - selectedLocation.lng, 2)
                );

            return distance < 0.0015;

        })
        .slice(0, 5);


    let html = `

        <h3>
            ${selectedLocation.icon}
            ${selectedLocation.name}
        </h3>

        <p>
            <b>Type:</b>
            ${selectedLocation.type}
        </p>

        <h4>📍 Nearby Locations</h4>

    `;


    if (nearby.length === 0) {

        html += `
            <p>No nearby locations found.</p>
        `;

    } else {

        nearby.forEach(function(place) {

            html += `

                <span class="nearby-item">

                    ${place.icon}
                    ${place.name}

                </span>

            `;

        });

    }


    document.getElementById(
        "location-info"
    ).innerHTML = html;

}
