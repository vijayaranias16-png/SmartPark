<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Crowd - SmartPark</title>

    <link rel="stylesheet"
          href="https://vijayaranias16-png.github.io/SmartPark/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">🎢 SmartPark</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="plan.html">Plan My Day</a>
        <a href="all-rides.html">Rides</a>
        <a href="places.html">Places</a>
        <a href="live-crowd.html">Live Crowd</a>
    </div>

</nav>


<div class="crowd-page">

    <div class="crowd-header">

        <p>SMARTPARK LIVE</p>

        <h1>👥 Live Crowd</h1>

        <span>Check ride crowd levels before you visit</span>

    </div>


    <div class="crowd-summary">

        <div class="crowd-box">
            <strong id="totalRides">0</strong>
            <small>Active Rides</small>
        </div>

        <div class="crowd-box">
            <strong id="lowCount">0</strong>
            <small>Low Crowd</small>
        </div>

        <div class="crowd-box">
            <strong id="mediumCount">0</strong>
            <small>Medium Crowd</small>
        </div>

        <div class="crowd-box">
            <strong id="highCount">0</strong>
            <small>High Crowd</small>
        </div>

    </div>


    <div class="crowd-message" id="crowdMessage">
        🔄 Loading live crowd...
    </div>


    <div class="crowd-grid" id="crowdGrid"></div>


    <button class="crowd-refresh" onclick="loadCrowd()">
        🔄 Refresh Crowd
    </button>


    <button class="crowd-back"
            onclick="window.location.href='index.html'">
        ← Back to Home
    </button>

</div>


<script src="park-data.js"></script>

<script>

function loadCrowd() {

    const rides = parkData.rides;

    const grid = document.getElementById("crowdGrid");

    grid.innerHTML = "";

    let low = 0;
    let medium = 0;
    let high = 0;

    rides.forEach(function(ride) {

        if (ride.crowd === "Low") {
            low++;
        }

        else if (ride.crowd === "Medium") {
            medium++;
        }

        else if (ride.crowd === "High") {
            high++;
        }


        const card = document.createElement("div");

        card.className = "crowd-card";


        let statusClass = "";

        if (ride.crowd === "Low") {
            statusClass = "low";
        }

        else if (ride.crowd === "Medium") {
            statusClass = "medium";
        }

        else {
            statusClass = "high";
        }


        card.innerHTML = `

            <div class="crowd-icon">
                ${ride.icon}
            </div>

            <div class="crowd-info">

                <h2>${ride.name}</h2>

                <p>${ride.type} Ride</p>

                <div class="wait-time">
                    ⏱️ ${ride.wait} min wait
                </div>

            </div>

            <div class="crowd-status ${statusClass}">
                ${ride.crowd}
            </div>

        `;


        grid.appendChild(card);

    });


    document.getElementById("totalRides").textContent = rides.length;

    document.getElementById("lowCount").textContent = low;

    document.getElementById("mediumCount").textContent = medium;

    document.getElementById("highCount").textContent = high;


    if (low > medium && low > high) {

        document.getElementById("crowdMessage").innerHTML =
            "🟢 It's less crowded now! Great time to enjoy the rides.";

    }

    else if (high > low && high > medium) {

        document.getElementById("crowdMessage").innerHTML =
            "🔴 The park is busy. Consider trying low-crowd rides.";

    }

    else {

        document.getElementById("crowdMessage").innerHTML =
            "🟡 Crowd levels are moderate. Plan your rides smartly.";

    }

}


loadCrowd();

</script>

</body>
</html>
